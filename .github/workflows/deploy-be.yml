name: Deploy MOSAIC Backend to AWS ECR and Server

on:
  push:
    tags:
      - 'dev-be-v*'
      - 'prod-be-v*'

env:
  AWS_REGION: us-east-1  # ECR Public always uses us-east-1
  ECR_REGISTRY_ALIAS: yhkim
  ECR_REPOSITORY: mosaic/mosaic-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.set-output.outputs.image-uri }}
      environment: ${{ steps.set-output.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set Registry env var
        run: |
          echo "REGISTRY=public.ecr.aws/${{ env.ECR_REGISTRY_ALIAS }}" >> $GITHUB_ENV

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          cd backend
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push to ECR
        run: |
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Set job outputs
        id: set-output
        run: |
          echo "image-uri=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          if [[ ${{ github.ref_name }} == dev-* ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=prod" >> $GITHUB_OUTPUT
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Set environment variables
        run: |
          if [[ "${{ needs.build-and-push.outputs.environment }}" == "dev" ]]; then
            echo "SERVER_HOST=${{ vars.DEV_SERVER_HOST }}" >> $GITHUB_ENV
            echo "SERVER_USER=${{ vars.DEV_SERVER_USER }}" >> $GITHUB_ENV
            echo "DEPLOY_PATH=${{ vars.DEV_DEPLOY_PATH }}" >> $GITHUB_ENV
          else
            echo "SERVER_HOST=${{ vars.PROD_SERVER_HOST }}" >> $GITHUB_ENV
            echo "SERVER_USER=${{ vars.PROD_SERVER_USER }}" >> $GITHUB_ENV
            echo "DEPLOY_PATH=${{ vars.PROD_DEPLOY_PATH }}" >> $GITHUB_ENV
          fi

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ needs.build-and-push.outputs.environment == 'dev' && secrets.DEV_SERVER_SSH_KEY || secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}

            sudo docker pull ${{ needs.build-and-push.outputs.image-uri }}
            sudo docker tag mosaic-be:latest mosaic-be:previous || true
            sudo docker compose stop mosaic-be
            sudo docker rmi mosaic-be:latest || true
            sudo docker tag ${{ needs.build-and-push.outputs.image-uri }} mosaic-be:latest
            sudo docker compose up -d mosaic-be
