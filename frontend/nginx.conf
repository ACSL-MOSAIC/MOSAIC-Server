server {
  listen 80;
  root /usr/share/nginx/html;

  # Content-hashed build assets: cache forever, but return a real 404 (not
  # index.html) when a chunk is missing so stale-hash requests fail cleanly
  # instead of being masked as an HTML response with the wrong MIME type.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA entry point: never cache so clients always revalidate and pick up the
  # latest index.html (and therefore the latest chunk hashes) after a deploy.
  location / {
    index index.html index.htm;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
