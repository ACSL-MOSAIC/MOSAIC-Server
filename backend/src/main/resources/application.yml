server:
  port: 9001

spring:
  application:
    name: backend

  jooq:
    sql-dialect: POSTGRES

  profiles:
    default: local

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

jwt:
  access-token:
    expiration-time: 15552000000  # 1 hour in milliseconds (1000 * 60 * 60) // TODO: fe does not have refresh logic yet
  refresh-token:
    expiration-time: 15552000000  # 6 months in milliseconds (1000 * 60 * 60 * 24 * 180)

mosaic:
  security:
    # AES-256 encryption key for private key storage (Base64 encoded)
    # Generate using AESKeyGeneratorTest.generateAESKey()
    encryption-key: --------NOT_A_VALID_KEY--------

# File storage paths (overridable by profiles)
file:
  storage:
    base-path: /var/mosaic/storage
    occupancy-map-path: /var/mosaic/storage/occupancy-maps

logging:
  level:
    root: INFO
    com.gistacsl.mosaic: INFO
    org.springframework: INFO
    org.springframework.web: INFO
    sun.rmi: INFO
    javax.management: INFO
